# Audit candidate activation override — canonical source in the repo.
# tools/restore_stack.sh installs this file as
# /etc/systemd/system/ai-calling-live.service.d/90-audit-candidate.conf.
# Originally installed 2026-10-30 per the activation review
# (logs/offline-qa/activation-review.md) with Nathan's approved
# decisions:
#   1. TELNYX_WEBHOOK_DB pinned to the shared production database
#      (blocker B1: the candidate otherwise opens a fresh local DB).
#   2. GEMINI_FAST_MODELS: evidence-backed 3.1 first, 3.5 second.
#   3. AI_CALLING_ALLOW_CLOSE_HEADER_WORKAROUND=1 for this VM's egress
#      proxy (restricted in code to the exact 101/Upgrade/close shape).
#   4. Probe fix (Oct 30, 2026): the egress proxy env's NO_PROXY
#      carries a bare ::1 that httpx cannot parse (InvalidURL), and
#      httpx's certifi bundle lacks the proxy CA. Sanitize the bypass
#      list and point TLS at the system store. The Environment= forms
#      below document intent; NO_PROXY only takes effect via the late
#      EnvironmentFile (systemd reads env files at spawn, after
#      Environment= assignments — verified Oct 30, 2026), which is
#      systemd/service-env-fix.env, also in this repo.
[Service]
WorkingDirectory=/home/hatch/ai-calling-candidate
ExecStartPre=
ExecStartPre=/home/hatch/.venvs/ai-calling-candidate-b849e45/bin/python /home/hatch/ai-calling-candidate/server/prestart.py
ExecStart=
ExecStart=/home/hatch/.venvs/ai-calling-candidate-b849e45/bin/python /home/hatch/ai-calling-candidate/server/start_live_server.py
Environment=NLTK_DATA=/home/hatch/ai-calling-candidate/nltk_data
Environment=TELNYX_WEBHOOK_DB=/home/hatch/workspace/ai-calling/logs/webhook.db
Environment=GEMINI_FAST_MODELS=gemini-3.1-flash-lite,gemini-3.5-flash-lite
Environment=AI_CALLING_ALLOW_CLOSE_HEADER_WORKAROUND=1
TimeoutStopSec=25
Environment=NO_PROXY=localhost,127.0.0.1
Environment=no_proxy=localhost,127.0.0.1
Environment=SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt
EnvironmentFile=/home/hatch/ai-calling-candidate/systemd/service-env-fix.env
